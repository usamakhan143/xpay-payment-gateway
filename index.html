<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XPay Payment Integration</title>

    <!-- Include XPay JavaScript SDK -->
    <script src="https://js.xstak.com/xpay-stage.js"></script>
  </head>
  <style>
    /* Basic Styling */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }

    #payment-container {
      background: white;
      padding: 20px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      width: 350px;
      text-align: center;
    }

    button {
      background: #5469d4;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #4058c5;
    }

    .hidden {
      display: none;
    }

    #payment-message {
      color: green;
      margin-top: 10px;
    }
  </style>
  <body>
    <div id="payment-container">
      <h2>Make a Payment</h2>
      <div id="payment-form"></div>
      <button id="pay-now">Pay Now</button>
      <p id="payment-message" class="hidden"></p>
    </div>

    <!-- Include JavaScript -->
    <script>
      // XPay Configuration
      const publishableKey = "key";
      const accountId = "id";
      const hmacSecret = "secret";

      // Initialize XPay
      const xpay = new Xpay(publishableKey, accountId, hmacSecret);

      // Payment Element Configuration
      xpay.element("#payment-form", {
        override: true,
        fields: {
          creditCard: {
            placeholder: "1234 1234 1234 1234",
            label: "Enter your credit card",
          },
          exp: {
            placeholder: "MM/YY",
          },
        },
      });

      // Handle Payment
      document.getElementById("pay-now").addEventListener("click", async () => {
        let customer = { name: "Guest User" };

        try {
          // Create a Payment Intent (fetch from server)
          const response = await fetch("process-payment.php", {
            method: "POST",
          });
          const { clientSecret, encryptionKey } = await response.json();

          // Confirm Payment
          const { error, message } = await xpay.confirmPayment(
            "card",
            clientSecret,
            customer,
            encryptionKey
          );

          // Show Payment Status
          if (error) {
            alert("Payment Failed: " + error);
          } else {
            document.getElementById("payment-message").textContent = message;
            document
              .getElementById("payment-message")
              .classList.remove("hidden");
          }
        } catch (e) {
          alert("Error: " + e.message);
        }
      });
    </script>
  </body>
</html>
